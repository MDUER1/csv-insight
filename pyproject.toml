[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-data-quality-platform"
version = "0.1.0"
description = "Local-first CSV data quality dashboard built with Streamlit and DuckDB."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "duckdb>=1.3.0,<2.0.0",
  "pandas>=2.2.0,<3.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "streamlit>=1.40.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

